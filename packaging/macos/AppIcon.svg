<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8b96f5"/>
      <stop offset="0.55" stop-color="#6f7ce8"/>
      <stop offset="1" stop-color="#414bbe"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#e6e9ff"/>
    </linearGradient>
  </defs>

  <!-- plate: macOS icon grid leaves a margin, so the art sits inside 100..924 -->
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#plate)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#sheen)"/>
  <rect x="100.5" y="100.5" width="823" height="823" rx="184.5" fill="none"
        stroke="#ffffff" stroke-opacity="0.35" stroke-width="3"/>

  <!-- spectrum bars, centred on 512 -->
  <g fill="url(#bar)">
    <rect x="264" y="452" width="76" height="120" rx="38"/>
    <rect x="378" y="372" width="76" height="280" rx="38"/>
    <rect x="492" y="272" width="76" height="480" rx="38"/>
    <rect x="606" y="352" width="76" height="320" rx="38"/>
    <rect x="720" y="432" width="76" height="160" rx="38"/>
  </g>
</svg>
