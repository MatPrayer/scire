name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always
  # A CI runner has no audio device and no GPU; the tests that need one skip
  # themselves, and the rest must not spend the runner's memory on debug info.
  CARGO_PROFILE_DEV_DEBUG: line-tables-only

jobs:
  check:
    name: fmt + clippy + test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      # gpui links against the system graphics, windowing and font stack; the
      # app itself needs alsa (audio) and dbus (media keys / MPRIS). Only
      # Linux: macOS ships every one of these with the SDK.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig-1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libx11-dev libvulkan-dev \
            libssl-dev pkg-config

      - name: Formatting
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Tests
        run: cargo test --workspace
