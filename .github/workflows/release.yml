name: Release

# Tag-driven: `git tag v1.0.0 && git push --tags` builds both platforms and
# attaches the artifacts to a **draft** release. Draft on purpose — publishing
# is the one step a person should do, after checking that what the runners
# built actually launches.
on:
  push:
    tags: ["v*"]
  # So the pipeline can be exercised without minting a tag. No release is
  # created then; the artifacts are left on the run.
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x86_64
          - os: macos-latest
            name: macos-arm64
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # Same list the CI workflow installs: gpui links against the system
      # graphics, windowing and font stack, and the app needs alsa and dbus.
      - name: Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libasound2-dev libdbus-1-dev libfontconfig1-dev libfreetype-dev \
            libwayland-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libx11-dev libxcb1-dev libvulkan-dev libssl-dev pkg-config

      # The release profile is fat LTO on one codegen unit, which is minutes of
      # a single core. That is the right trade for something people download.
      - name: Build
        run: cargo build --release

      # Both, not one or the other: the tarball is what every distro can
      # read, the .deb is for the share of desktop Linux where installing
      # something means apt. make-deb.sh derives its Depends from the binary's
      # own shared libraries with dpkg-query, so it is only correct when built
      # on the distro it targets — here, which is the point of building it here.
      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          packaging/linux/make-tarball.sh
          packaging/linux/make-deb.sh

      # A .dmg, the same artifact `cargo dmg` builds locally: the .app, an
      # Applications symlink to drag it onto, and the volume icon. What a runner
      # cannot do is the *presentation* — the background picture and the icon
      # positions go through Finder over Apple Events, which needs a GUI session
      # and an Automation consent an unattended machine cannot give, so
      # make-dmg.sh skips that pass rather than failing (DMG_PLAIN makes the
      # skip explicit instead of leaning on its Finder probe timing out).
      # Ad-hoc signed and not notarised, so Gatekeeper has to be answered on
      # first launch — the release notes say so.
      - name: Package (macOS)
        if: runner.os == 'macOS'
        env:
          CODESIGN_ID: "-"
          DMG_PLAIN: "1"
        run: packaging/macos/make-dmg.sh

      # One step per platform: upload-artifact roots the artifact at the least
      # common ancestor of its *search paths*, so one step naming target/linux
      # and target/macos together rooted it at target/ and the archives arrived
      # under linux/ and macos/. `files: artifacts/*` below then globbed those
      # directories instead of the archives inside them, and what reached the
      # release page was a container holding a container holding the tarball.
      # Several paths in one step are fine while they share a parent, which is
      # why the Linux tarball and .deb can sit together.
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: ${{ matrix.name }}
          path: |
            target/linux/*.tar.gz
            target/linux/*.deb
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: ${{ matrix.name }}
          path: target/macos/*.dmg
          if-no-files-found: error

  release:
    name: Draft release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Draft the release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: artifacts/*
          body: |
            See [CHANGELOG.md](https://github.com/MatPrayer/scire/blob/main/CHANGELOG.md)
            for what is in this release.

            **Linux** — on Debian/Ubuntu, `sudo apt install ./scire_*.deb`.
            Otherwise extract the tarball and run `./install.sh` (or
            `sudo ./install.sh --system`). On Arch, `scire` is in the AUR.

            **macOS** — open the `.dmg` and drag Scirè into Applications. The
            app is ad-hoc signed and not notarised, so the first launch needs
            *right-click → Open* rather than a double click. Building from
            source avoids that entirely.
