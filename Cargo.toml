[workspace]
resolver = "3"
members = ["crates/subsonic", "crates/playback", "crates/app", "crates/dmg"]
# `crates/dmg` carries a second workspace binary (`cargo-dmg`, the packaging
# subcommand), which made a bare `cargo run` ambiguous. The app is what anyone
# running the workspace means; the packager is reached through `cargo dmg`.
# Commands that want the whole tree still say so — `cargo test --workspace`,
# `cargo clippy --workspace`.
default-members = ["crates/app"]

[workspace.package]
version = "0.5.3"
edition = "2024"
license = "MIT"

[workspace.dependencies]
# UI
# runtime_shaders: compile Metal shaders at runtime — avoids needing the
# `metal` CLI (absent with Command Line Tools-only installs).
gpui = { version = "0.2.2", features = ["runtime_shaders"] }
gpui-component = "0.5.1"
gpui-component-assets = "0.5.1"

# Audio
# symphonia-all: rodio's defaults cover flac/mp3/aac-mp4/vorbis/wav only, so an
# m4a holding ALAC (or aiff/mkv/caf/adpcm) fails to decode. A Navidrome library
# can hold anything symphonia can read — enable the lot.
rodio = { version = "0.22.2", features = ["symphonia-all"] }
stream-download = { version = "0.24.1", features = ["reqwest", "temp-storage"] }

# HTTP / async
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"

# Utilities
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
md-5 = "0.10"
rand = "0.9"
thiserror = "2"
anyhow = "1"
directories = "6"
keyring = "4"
souvlaki = "0.8"
rusqlite = { version = "0.32", features = ["bundled"] }
lofty = "0.18"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev
wiremock = "0.6"

# Local crates
subsonic = { path = "crates/subsonic" }
playback = { path = "crates/playback" }

[profile.dev]
opt-level = 0
# Full DWARF made each dev binary ~800MB; cargo keeps every stale hashed copy,
# so target/debug grew to 43GB. Line tables keep backtraces useful (file:line)
# at a fraction of the size — the tradeoff is no local-variable inspection in a
# debugger. "unpacked" leaves debug info in the .o files instead of copying it
# into every linked binary.
debug = "line-tables-only"
split-debuginfo = "unpacked"
incremental = true

# Every *dependency* is optimized in dev builds; only the workspace crates
# stay at opt-level 0, where the fast rebuild actually matters.
#
# The heavy lifting a debug build does is almost all in dependencies: cover
# decode (`image`/`zune-jpeg`/`png`), the bundled SQLite C library, `lofty`
# tag reads during a scan, symphonia decoding every played track, and an md5
# per Subsonic request. Unoptimized those run several times slower than the
# shipped binary, which is what made `cargo run` feel slow in ways `--release`
# never was. Deps are compiled once and cached, so this costs one longer first
# build and nothing afterwards.
[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = "symbols"
debug = 0
# Already stripping — don't generate debug sections we'd just throw away.
split-debuginfo = "off"

[profile.release.build-override]
opt-level = 0
codegen-units = 16

# Local fork of gpui-component 0.5.1 — single-line change: popover_style shadow
# removed (was shadow_lg) so context menus don't cast a heavy halo over the
# bright album grid. See vendor/gpui-component/src/styled.rs.
[patch.crates-io]
gpui-component = { path = "vendor/gpui-component" }
